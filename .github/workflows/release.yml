name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the dashboard
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.0.6
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build

      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: tar -czf "linux-all-casaos-${RELEASE_TAG}.tar.gz" build

      - name: Generate the SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: spdx-json
          output-file: casaos-ui-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            linux-all-casaos-${{ github.ref_name }}.tar.gz

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            linux-all-casaos-${{ github.ref_name }}.tar.gz
          sbom-path: casaos-ui-${{ github.ref_name }}.spdx.json

      - name: Publish release assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            linux-all-casaos-${{ github.ref_name }}.tar.gz
            casaos-ui-${{ github.ref_name }}.spdx.json
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
